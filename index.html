<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimiento de Herramientas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#20262B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --charcoal: #20262B;
    --charcoal-deep: #171B1F;
    --panel: #F4EFE4;
    --panel-dim: #E7E0D0;
    --amber: #E8A33D;
    --copper: #B5651D;
    --ok: #3F8E5B;
    --warn: #D98B2B;
    --danger: #C1443D;
    --ink: #21262B;
    --ink-dim: #5C645C;
    --cream: #F0EBDE;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--charcoal);
    color: var(--cream);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100%;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 22px 16px 90px; position: relative; }

  header.top { margin-bottom: 18px; }
  header.top h1 {
    font-size: 1.5rem; font-weight: 700; margin: 0 0 4px;
    color: var(--panel);
  }
  header.top p { margin: 0; font-size: 0.85rem; color: #9BA39B; }

  .stats-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .stat {
    flex: 1; background: rgba(244,239,228,0.06);
    border: 1px solid rgba(244,239,228,0.12);
    border-radius: 10px; padding: 10px 8px; text-align: center;
  }
  .stat .num {
    font-family: 'IBM Plex Mono', monospace; font-size: 1.5rem; font-weight: 600;
    color: var(--amber); line-height: 1;
  }
  .stat.danger .num { color: var(--danger); }
  .stat.ok .num { color: var(--ok); }
  .stat .lbl { font-size: 0.68rem; color: #9BA39B; margin-top: 4px; }

  .section-title {
    font-size: 0.78rem; text-transform: none; color: #9BA39B;
    margin: 22px 0 10px; font-weight: 500;
  }

  .tool-card {
    background: var(--panel); color: var(--ink);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px; cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.18);
  }
  .status-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.ok { background: var(--ok); }
  .status-dot.warn { background: var(--warn); }
  .status-dot.danger { background: var(--danger); }

  .tool-card .body { flex: 1; min-width: 0; }
  .tool-card .name { font-weight: 600; font-size: 0.98rem; margin-bottom: 2px; }
  .tool-card .meta {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--ink-dim);
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .tool-card .due {
    font-size: 0.72rem; text-align: right; color: var(--ink-dim); flex-shrink: 0;
  }
  .tool-card .due.warn { color: var(--warn); font-weight: 600; }
  .tool-card .due.danger { color: var(--danger); font-weight: 600; }

  .empty-msg {
    text-align: center; color: #9BA39B; padding: 30px 20px; font-size: 0.9rem;
  }

  .fab {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    width: min(448px, calc(100% - 32px));
    background: var(--amber); color: var(--charcoal-deep);
    border: none; border-radius: 12px; padding: 15px;
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 0.95rem;
    cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }

  .view { display: none; }
  .view.active { display: block; }

  .back-btn {
    background: none; border: none; color: #9BA39B; font-size: 0.85rem;
    cursor: pointer; padding: 4px 0 14px; font-family: 'IBM Plex Sans', sans-serif;
  }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.78rem; color: #9BA39B; margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 12px; border-radius: 9px;
    border: 1px solid rgba(244,239,228,0.18); background: rgba(244,239,228,0.06);
    color: var(--panel); font-family: 'IBM Plex Sans', sans-serif; font-size: 0.92rem;
  }
  .field input::placeholder, .field textarea::placeholder { color: #6b746b; }
  .field textarea { resize: vertical; min-height: 60px; }

  .btn {
    padding: 13px 16px; border-radius: 10px; border: none;
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 0.9rem;
    cursor: pointer; width: 100%;
  }
  .btn-primary { background: var(--amber); color: var(--charcoal-deep); }
  .btn-secondary {
    background: rgba(244,239,228,0.08); color: var(--panel);
    border: 1px solid rgba(244,239,228,0.2);
  }
  .btn-danger-outline {
    background: none; color: var(--danger); border: 1px solid var(--danger);
  }
  .btn-row { display: flex; gap: 10px; margin-top: 18px; }
  .btn-row .btn { flex: 1; }

  .detail-header { margin-bottom: 16px; }
  .detail-header h2 { font-size: 1.35rem; margin: 0 0 4px; color: var(--panel); }
  .detail-header .code-line {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; color: #9BA39B;
  }

  .info-grid {
    background: rgba(244,239,228,0.06); border-radius: 10px; padding: 14px 16px;
    margin-bottom: 18px; font-size: 0.85rem;
  }
  .info-row { display: flex; justify-content: space-between; padding: 6px 0; }
  .info-row + .info-row { border-top: 1px solid rgba(244,239,228,0.08); }
  .info-row .k { color: #9BA39B; }
  .info-row .v { font-family: 'IBM Plex Mono', monospace; color: var(--panel); text-align: right; }

  .status-banner {
    border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;
    font-size: 0.85rem; font-weight: 500; display: flex; justify-content: space-between; align-items: center;
  }
  .status-banner.ok { background: rgba(63,142,91,0.18); color: #8FD4A8; }
  .status-banner.warn { background: rgba(217,139,43,0.18); color: #F0C27B; }
  .status-banner.danger { background: rgba(193,68,61,0.18); color: #F0958E; }

  .checklist-item {
    display: flex; align-items: center; gap: 10px;
    background: rgba(244,239,228,0.06); border-radius: 9px;
    padding: 11px 12px; margin-bottom: 8px;
  }
  .checklist-item input[type="checkbox"] { width: 19px; height: 19px; accent-color: var(--amber); flex-shrink: 0; }
  .checklist-item .txt { flex: 1; font-size: 0.88rem; }
  .checklist-item .remove-x {
    color: #9BA39B; cursor: pointer; font-size: 1rem; padding: 0 4px; flex-shrink: 0;
  }

  .add-check-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .add-check-row input { flex: 1; }
  .add-check-row button {
    background: rgba(244,239,228,0.1); color: var(--panel); border: 1px solid rgba(244,239,228,0.2);
    border-radius: 9px; padding: 0 16px; font-size: 1.1rem; cursor: pointer;
  }

  .history-entry {
    background: rgba(244,239,228,0.05); border-radius: 9px; padding: 10px 12px; margin-bottom: 8px;
  }
  .history-entry .date-line {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--amber); margin-bottom: 4px;
  }
  .history-entry .summary { font-size: 0.82rem; color: #C9CFC7; }
  .history-entry .note { font-size: 0.8rem; color: #9BA39B; margin-top: 4px; font-style: italic; }

  select { appearance: none; -webkit-appearance: none; }
  select option { background: var(--charcoal); color: var(--panel); }
</style>
</head>
<body>
<div class="app">

  <!-- HOME VIEW -->
  <div class="view active" id="view-home">
    <header class="top">
      <h1>Mantenimiento de Herramientas</h1>
      <p>Inventario, mantenimientos e inspecciones</p>
    </header>
    <div class="stats-row">
      <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
      <div class="stat danger"><div class="num" id="statOverdue">0</div><div class="lbl">Vencidos</div></div>
      <div class="stat ok"><div class="num" id="statSoon">0</div><div class="lbl">Esta semana</div></div>
    </div>
    <div class="section-title">Herramientas</div>
    <div id="toolList"></div>
  </div>

  <!-- ADD/EDIT TOOL VIEW -->
  <div class="view" id="view-form">
    <button class="back-btn" onclick="showView('home')">← Volver</button>
    <div class="detail-header"><h2 id="formTitle">Nueva herramienta</h2></div>

    <div class="field">
      <label>Nombre de la herramienta</label>
      <input type="text" id="f-name" placeholder="Ej: Taladro Bosch GSB 550">
    </div>
    <div class="field">
      <label>Categoría</label>
      <input type="text" id="f-category" placeholder="Ej: Eléctrica, Manual, Medición">
    </div>
    <div class="field">
      <label>Código / N° de serie</label>
      <input type="text" id="f-code" placeholder="Ej: HT-014">
    </div>
    <div class="field">
      <label>Ubicación</label>
      <input type="text" id="f-location" placeholder="Ej: Bodega A, estante 3">
    </div>
    <div class="field">
      <label>Frecuencia de mantenimiento</label>
      <select id="f-frequency">
        <option value="7">Cada 7 días</option>
        <option value="15">Cada 15 días</option>
        <option value="30" selected>Cada 30 días</option>
        <option value="60">Cada 60 días</option>
        <option value="90">Cada 90 días</option>
        <option value="180">Cada 6 meses</option>
        <option value="365">Cada año</option>
      </select>
    </div>
    <div class="field">
      <label>Fecha del último mantenimiento</label>
      <input type="date" id="f-lastdate">
    </div>
    <div class="field">
      <label>Notas (opcional)</label>
      <textarea id="f-notes" placeholder="Observaciones generales"></textarea>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" onclick="showView('home')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveTool()">Guardar</button>
    </div>
  </div>

  <!-- TOOL DETAIL VIEW -->
  <div class="view" id="view-detail">
    <button class="back-btn" onclick="showView('home')">← Volver</button>
    <div class="detail-header">
      <h2 id="detailName"></h2>
      <div class="code-line" id="detailCode"></div>
    </div>

    <div class="status-banner" id="detailStatusBanner"></div>

    <div class="info-grid" id="detailInfoGrid"></div>

    <button class="btn btn-primary" id="markDoneBtn" style="margin-bottom:22px;">Registrar mantenimiento hoy</button>

    <div class="section-title">Checklist de inspección</div>
    <div id="checklistArea"></div>
    <div class="add-check-row">
      <input type="text" id="newCheckItem" placeholder="Agregar punto de revisión">
      <button onclick="addChecklistItem()">+</button>
    </div>
    <button class="btn btn-secondary" style="margin-bottom:22px;" onclick="saveInspection()">Guardar inspección de hoy</button>

    <div class="section-title">Historial de inspecciones</div>
    <div id="historyArea"></div>

    <button class="btn btn-danger-outline" style="margin-top:24px;" onclick="deleteTool()">Eliminar herramienta</button>
  </div>

  <button class="fab" id="fabBtn" onclick="openNewToolForm()">+ Agregar herramienta</button>
</div>

<script>
const STORAGE_KEY = "tools-maintenance-data";
const DEFAULT_CHECKLIST = [
  "Revisar cables y conexiones",
  "Verificar funcionamiento general",
  "Limpiar y remover residuos",
  "Lubricar partes móviles",
  "Verificar elementos de seguridad"
];

let tools = [];
let currentToolId = null;
let editingToolId = null;

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function daysBetween(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const now = new Date();
  const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((d - nowMid) / (1000 * 60 * 60 * 24));
}

function nextDueDate(lastDate, freqDays) {
  const d = new Date(lastDate + "T00:00:00");
  d.setDate(d.getDate() + parseInt(freqDays, 10));
  return d.toISOString().slice(0, 10);
}

function formatDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
}

function statusFor(tool) {
  const due = nextDueDate(tool.lastMaintenanceDate, tool.frequencyDays);
  const diff = daysBetween(due);
  if (diff < 0) return { level: "danger", due, diff };
  if (diff <= 7) return { level: "warn", due, diff };
  return { level: "ok", due, diff };
}

async function loadTools() {
  try {
    const result = await window.storage.get(STORAGE_KEY, false);
    tools = result ? JSON.parse(result.value) : [];
  } catch (e) {
    tools = [];
  }
}

async function saveTools() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(tools), false);
  } catch (e) {
    console.error("Storage error:", e);
  }
}

function showView(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("view-" + name).classList.add("active");
  document.getElementById("fabBtn").style.display = name === "home" ? "block" : "none";
  if (name === "home") renderHome();
}

function renderHome() {
  document.getElementById("statTotal").textContent = tools.length;
  let overdue = 0, soon = 0;
  const listEl = document.getElementById("toolList");

  if (tools.length === 0) {
    listEl.innerHTML = `<div class="empty-msg">Aún no has agregado herramientas.<br>Toca "Agregar herramienta" para empezar.</div>`;
    document.getElementById("statOverdue").textContent = "0";
    document.getElementById("statSoon").textContent = "0";
    return;
  }

  const sorted = [...tools].sort((a, b) => {
    const da = nextDueDate(a.lastMaintenanceDate, a.frequencyDays);
    const db = nextDueDate(b.lastMaintenanceDate, b.frequencyDays);
    return new Date(da) - new Date(db);
  });

  listEl.innerHTML = sorted.map(tool => {
    const st = statusFor(tool);
    if (st.level === "danger") overdue++;
    if (st.level === "warn") soon++;
    let dueText;
    if (st.diff < 0) dueText = `Vencido hace ${Math.abs(st.diff)}d`;
    else if (st.diff === 0) dueText = "Vence hoy";
    else dueText = `En ${st.diff}d`;
    return `
      <div class="tool-card" onclick="openDetail('${tool.id}')">
        <div class="status-dot ${st.level}"></div>
        <div class="body">
          <div class="name">${escapeHtml(tool.name)}</div>
          <div class="meta"><span>${escapeHtml(tool.code || "—")}</span><span>${escapeHtml(tool.category || "")}</span></div>
        </div>
        <div class="due ${st.level}">${dueText}<br>${formatDate(st.due)}</div>
      </div>
    `;
  }).join("");

  document.getElementById("statOverdue").textContent = overdue;
  document.getElementById("statSoon").textContent = soon;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function openNewToolForm() {
  editingToolId = null;
  document.getElementById("formTitle").textContent = "Nueva herramienta";
  document.getElementById("f-name").value = "";
  document.getElementById("f-category").value = "";
  document.getElementById("f-code").value = "";
  document.getElementById("f-location").value = "";
  document.getElementById("f-frequency").value = "30";
  document.getElementById("f-lastdate").value = todayStr();
  document.getElementById("f-notes").value = "";
  showView("form");
}

async function saveTool() {
  const name = document.getElementById("f-name").value.trim();
  if (!name) { alert("Por favor ingresa el nombre de la herramienta."); return; }

  const data = {
    name,
    category: document.getElementById("f-category").value.trim(),
    code: document.getElementById("f-code").value.trim(),
    location: document.getElementById("f-location").value.trim(),
    frequencyDays: document.getElementById("f-frequency").value,
    lastMaintenanceDate: document.getElementById("f-lastdate").value || todayStr(),
    notes: document.getElementById("f-notes").value.trim()
  };

  if (editingToolId) {
    const tool = tools.find(t => t.id === editingToolId);
    Object.assign(tool, data);
  } else {
    tools.push({
      id: "t" + Date.now(),
      ...data,
      checklist: [...DEFAULT_CHECKLIST],
      inspections: []
    });
  }
  await saveTools();
  showView("home");
}

function openDetail(id) {
  currentToolId = id;
  renderDetail();
  showView("detail");
}

function renderDetail() {
  const tool = tools.find(t => t.id === currentToolId);
  if (!tool) { showView("home"); return; }

  document.getElementById("detailName").textContent = tool.name;
  document.getElementById("detailCode").textContent = [tool.code, tool.category].filter(Boolean).join(" · ") || "Sin código";

  const st = statusFor(tool);
  const banner = document.getElementById("detailStatusBanner");
  banner.className = "status-banner " + st.level;
  let msg;
  if (st.level === "danger") msg = `Mantenimiento vencido hace ${Math.abs(st.diff)} día(s)`;
  else if (st.level === "warn") msg = st.diff === 0 ? "Mantenimiento vence hoy" : `Mantenimiento vence en ${st.diff} día(s)`;
  else msg = `Al día · próximo en ${st.diff} día(s)`;
  banner.innerHTML = `<span>${msg}</span><span>${formatDate(st.due)}</span>`;

  document.getElementById("detailInfoGrid").innerHTML = `
    <div class="info-row"><span class="k">Ubicación</span><span class="v">${escapeHtml(tool.location || "—")}</span></div>
    <div class="info-row"><span class="k">Frecuencia</span><span class="v">Cada ${tool.frequencyDays} días</span></div>
    <div class="info-row"><span class="k">Último mantenimiento</span><span class="v">${formatDate(tool.lastMaintenanceDate)}</span></div>
    ${tool.notes ? `<div class="info-row"><span class="k">Notas</span><span class="v">${escapeHtml(tool.notes)}</span></div>` : ""}
  `;

  renderChecklist(tool);
  renderHistory(tool);

  document.getElementById("markDoneBtn").onclick = async () => {
    tool.lastMaintenanceDate = todayStr();
    await saveTools();
    renderDetail();
  };
}

function renderChecklist(tool) {
  const area = document.getElementById("checklistArea");
  if (!tool.checklist || tool.checklist.length === 0) {
    area.innerHTML = `<div class="empty-msg" style="padding:14px 0;">Sin puntos de revisión. Agrega uno abajo.</div>`;
    return;
  }
  area.innerHTML = tool.checklist.map((item, idx) => `
    <div class="checklist-item">
      <input type="checkbox" id="chk-${idx}" data-idx="${idx}">
      <span class="txt">${escapeHtml(item)}</span>
      <span class="remove-x" onclick="removeChecklistItem(${idx})">✕</span>
    </div>
  `).join("");
}

function addChecklistItem() {
  const input = document.getElementById("newCheckItem");
  const val = input.value.trim();
  if (!val) return;
  const tool = tools.find(t => t.id === currentToolId);
  tool.checklist = tool.checklist || [];
  tool.checklist.push(val);
  input.value = "";
  saveTools();
  renderChecklist(tool);
}

function removeChecklistItem(idx) {
  const tool = tools.find(t => t.id === currentToolId);
  tool.checklist.splice(idx, 1);
  saveTools();
  renderChecklist(tool);
}

async function saveInspection() {
  const tool = tools.find(t => t.id === currentToolId);
  const checks = tool.checklist.map((item, idx) => {
    const cb = document.getElementById("chk-" + idx);
    return { item, passed: cb ? cb.checked : false };
  });
  const passedCount = checks.filter(c => c.passed).length;

  tool.inspections = tool.inspections || [];
  tool.inspections.unshift({
    date: todayStr(),
    checks,
    summary: `${passedCount}/${checks.length} puntos revisados OK`
  });

  await saveTools();
  renderChecklist(tool);
  renderHistory(tool);
  alert("Inspección guardada.");
}

function renderHistory(tool) {
  const area = document.getElementById("historyArea");
  const inspections = tool.inspections || [];
  if (inspections.length === 0) {
    area.innerHTML = `<div class="empty-msg" style="padding:14px 0;">Sin inspecciones registradas todavía.</div>`;
    return;
  }
  area.innerHTML = inspections.slice(0, 10).map(insp => `
    <div class="history-entry">
      <div class="date-line">${formatDate(insp.date)}</div>
      <div class="summary">${escapeHtml(insp.summary)}</div>
    </div>
  `).join("");
}

async function deleteTool() {
  if (!confirm("¿Eliminar esta herramienta y todo su historial? Esta acción no se puede deshacer.")) return;
  tools = tools.filter(t => t.id !== currentToolId);
  await saveTools();
  showView("home");
}

(async function init() {
  await loadTools();
  renderHome();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>
</body>
</html>
